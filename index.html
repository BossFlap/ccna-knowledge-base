<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CCNA 200-301 v1.1 — Knowledge Base</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="css/style.css?v=4">
</head>
<body>

  <!-- SIDEBAR -->
  <aside id="sidebar">
    <div id="sidebar-header">
      <div id="sidebar-logo">
        <div class="logo-icon">CC</div>
        <h1>CCNA<span>200-301 v1.1 Knowledge Base</span></h1>
      </div>
      <input type="text" id="sidebar-search" placeholder="🔍 Themen filtern …" title="Enter startet die Volltextsuche">
    </div>
    <nav id="sidebar-nav"></nav>
    <div style="padding:12px 16px;border-top:1px solid rgba(255,255,255,0.07)">
      <div onclick="navigateHome()" style="display:flex;align-items:center;gap:8px;padding:8px;cursor:pointer;color:#64748b;font-size:13px;border-radius:6px;" onmouseover="this.style.background='rgba(255,255,255,0.05)'" onmouseout="this.style.background=''">
        🏠 <span>Startseite</span>
      </div>
    </div>
  </aside>

  <!-- MAIN -->
  <main id="main">
    <div id="topbar">
      <button id="menu-toggle">☰</button>
      <div id="breadcrumb"></div>
      <div class="topbar-search">
        <input type="text" id="global-search" placeholder="🔍 Alles durchsuchen …  Strg+K" autocomplete="off" spellcheck="false">
      </div>
      <button class="btn-icon" id="search-btn" onclick="renderSearch(state.lastQuery || '')" title="Suche">🔍</button>
      <div class="topbar-actions" id="topbar-actions">
        <button class="btn-icon" id="dark-toggle">🌙 Dunkel</button>
      </div>
    </div>
    <div id="read-progress" title="Lesefortschritt"><div></div></div>
    <div id="content-area"></div>
    <button id="back-top" onclick="scrollTop()" title="Nach oben">↑</button>
    <nav id="bottom-nav">
      <button data-view="home" onclick="navigateHome()"><span>🏠</span>Home</button>
      <button data-view="topic" onclick="toggleSidebar()"><span>📚</span>Themen</button>
      <button data-view="search" onclick="renderSearch(state.lastQuery || '')"><span>🔍</span>Suche</button>
      <button data-view="review" onclick="navigateTool('review')"><span>🔁<i id="bn-due" class="bn-badge"></i></span>Lernen</button>
      <button data-view="subnet" onclick="navigateTool('subnet')"><span>🧮</span>Subnetting</button>
    </nav>
  </main>

  <script src="js/data.js?v=4"></script>
  <script src="js/topics/01-fundamentals.js?v=4"></script>
  <script src="js/topics/02-access.js?v=4"></script>
  <script src="js/topics/03-connectivity.js?v=4"></script>
  <script src="js/topics/04-services.js?v=4"></script>
  <script src="js/topics/05-security.js?v=4"></script>
  <script src="js/topics/06-automation.js?v=4"></script>
  <script src="js/exam.js?v=4"></script>
  <script src="js/search.js?v=4"></script>
  <script src="js/learn.js?v=4"></script>
  <script src="js/subnet.js?v=4"></script>
  <script src="js/app.js?v=4"></script>
</body>
</html>
