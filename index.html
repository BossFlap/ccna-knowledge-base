<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CCNA 200-301 — Knowledge Base</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- SIDEBAR -->
  <aside id="sidebar">
    <div id="sidebar-header">
      <div id="sidebar-logo">
        <div class="logo-icon">CC</div>
        <h1>CCNA<span>200-301 Knowledge Base</span></h1>
      </div>
      <input type="text" id="sidebar-search" placeholder="🔍 Thema suchen…">
    </div>
    <nav id="sidebar-nav"></nav>
    <div style="padding:12px 16px;border-top:1px solid rgba(255,255,255,0.07)">
      <div onclick="navigateHome()" style="display:flex;align-items:center;gap:8px;padding:8px;cursor:pointer;color:#64748b;font-size:13px;border-radius:6px;" onmouseover="this.style.background='rgba(255,255,255,0.05)'" onmouseout="this.style.background=''">
        🏠 <span>Startseite</span>
      </div>
    </div>
  </aside>

  <!-- MAIN -->
  <main id="main">
    <div id="topbar">
      <button id="menu-toggle">☰</button>
      <div id="breadcrumb"></div>
      <div class="topbar-actions" id="topbar-actions">
        <button class="btn-icon" id="dark-toggle">🌙 Dunkel</button>
      </div>
    </div>
    <div id="content-area"></div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
